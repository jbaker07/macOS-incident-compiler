<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Compiler</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e2e0;
    --high: #b42318; --medium: #b54708; --low: #3b6e3b; --ok: #1f7a4d; --bad: #b42318; --accent: #2f5bb7;
    --code: #f0f0ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa2; --line: #333338;
      --high: #f97066; --medium: #fdb022; --low: #73c991; --ok: #47cd89; --bad: #f97066; --accent: #84adff;
      --code: #2a2a2e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .status { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1.3fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.row { cursor: pointer; }
  tr.row:hover, tr.row.selected { background: var(--code); }
  .sev { font-weight: 600; font-size: 12px; }
  .sev.HIGH, .sev.CRITICAL { color: var(--high); }
  .sev.MEDIUM { color: var(--medium); }
  .sev.LOW { color: var(--low); }
  .muted { color: var(--muted); }
  .stats { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .stats div { font-size: 13px; }
  .slot { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 8px 0; }
  .slot h3 { font-size: 13px; margin: 0 0 4px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); }
  .badge.bad { color: var(--bad); }
  pre { background: var(--code); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  a { color: var(--accent); }
  .empty { color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <h1>Incident Compiler</h1>
  <span class="status" id="status">Connecting</span>
</header>
<main>
  <section>
    <h2>Detections</h2>
    <div class="stats" id="stats"></div>
    <table>
      <thead><tr><th>Time (UTC)</th><th>Severity</th><th>Playbook</th><th>Host</th></tr></thead>
      <tbody id="signals"></tbody>
    </table>
    <div class="empty" id="no-signals" hidden>No detections yet. Replay a trail with capture_macos_rotating --bsm-file, then run edr-locald.</div>
  </section>
  <section id="detail">
    <h2>Explanation</h2>
    <div class="empty">Pick a detection to see which audit records filled each playbook slot.</div>
  </section>
</main>
<script>
// edr-server serves this page, so every API call is a relative URL.
const API = "";

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const child of children || []) node.append(child);
  return node;
}

async function getJson(path) {
  const response = await fetch(API + path, { cache: "no-store" });
  const body = await response.json();
  if (!body.success) throw new Error(body.error || ("HTTP " + response.status));
  return body.data;
}

function timeText(ms) {
  return new Date(ms).toISOString().replace("T", " ").replace(".000Z", "").replace("Z", "");
}

// Fields worth showing for each kind of event, in order.
const EVENT_FIELDS = ["pid", "ppid", "exe", "cmdline", "path", "new_path", "remote_ip", "remote_port",
  "target_pid", "target_uid", "uid", "euid", "auid", "asid", "success", "errno", "signing_id"];

function eventSummary(event) {
  if (!event) return "event not found in the segment file";
  const lines = [event.tags.join(".")];
  for (const key of EVENT_FIELDS) {
    if (event.fields && key in event.fields) lines.push(key + ": " + JSON.stringify(event.fields[key]));
  }
  return lines.join("\n");
}

async function showDetail(signal, row) {
  document.querySelectorAll("tr.row").forEach(r => r.classList.remove("selected"));
  row.classList.add("selected");
  const detail = document.getElementById("detail");
  detail.replaceChildren(el("h2", { text: "Explanation" }), el("div", { class: "muted", text: "Loading" }));
  let exp;
  try {
    exp = await getJson("/api/signals/" + encodeURIComponent(signal.signal_id) + "/explain");
  } catch (err) {
    detail.replaceChildren(el("h2", { text: "Explanation" }), el("div", { class: "empty", text: String(err.message) }));
    return;
  }
  const parts = [
    el("h2", { text: exp.title }),
    el("div", {}, [el("span", { class: "sev " + exp.severity, text: exp.severity }), " ",
      el("span", { class: "muted", text: exp.family + " | " + (exp.mitre_techniques || []).join(", ") })]),
    el("p", { text: exp.narrative || "" }),
    el("div", { class: "muted", text: "Scope: " + exp.scope }),
    el("div", { class: "muted", text: "Incident: " + exp.incident_id + "    Signal: " + exp.signal_id }),
    el("div", {}, [el("span", { class: "badge " + (exp.evidence_verified ? "ok" : "bad"),
      text: exp.evidence_verified ? "every evidence line matches its SHA-256" : "evidence could not be verified" })]),
  ];
  for (const slot of exp.slots) {
    const box = el("div", { class: "slot" }, [
      el("h3", { text: slot.name }),
      el("div", { class: "muted", text: slot.slot_id + " | " + slot.fact_type + " | " +
        (slot.required ? "required" : "optional") + " | " + (slot.filled ? "filled" : "not filled") }),
    ]);
    for (const ev of slot.evidence) {
      box.append(
        el("div", { class: "muted" }, [
          "segment " + ev.segment_seq + ", record " + ev.record_index + " ",
          el("span", { class: "badge " + (ev.verified ? "ok" : "bad"), text: ev.verified ? "hash ok" : "hash mismatch" }),
        ]),
        el("pre", { text: eventSummary(ev.event) }),
      );
    }
    parts.push(box);
  }
  detail.replaceChildren(...parts);
}

async function load() {
  const status = document.getElementById("status");
  try {
    const health = await fetch(API + "/api/health", { cache: "no-store" }).then(r => r.json());
    status.textContent = "Server " + health.status + ", version " + health.version;
  } catch (err) {
    status.textContent = "Server not reachable at " + (API || location.origin);
    return;
  }
  const [signals, stats] = await Promise.all([getJson("/api/signals?limit=200"), getJson("/api/signals/stats")]);
  const statBox = document.getElementById("stats");
  statBox.replaceChildren(el("div", { text: stats.total + " detections" }));
  for (const [sev, count] of Object.entries(stats.by_severity || {})) {
    statBox.append(el("div", {}, [el("span", { class: "sev " + sev, text: sev }), " " + count]));
  }
  const body = document.getElementById("signals");
  body.replaceChildren();
  document.getElementById("no-signals").hidden = signals.length > 0;
  for (const signal of signals) {
    const title = (signal.metadata && signal.metadata.title) || signal.signal_type;
    const row = el("tr", { class: "row" }, [
      el("td", { text: timeText(signal.ts) }),
      el("td", {}, [el("span", { class: "sev " + signal.severity, text: signal.severity })]),
      el("td", {}, [el("div", { text: title }), el("code", { class: "muted", text: signal.signal_type })]),
      el("td", { text: signal.host }),
    ]);
    row.addEventListener("click", () => showDetail(signal, row));
    body.append(row);
  }
}

load();
</script>
</body>
</html>
