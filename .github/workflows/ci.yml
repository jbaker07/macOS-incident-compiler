name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pipeline:
    # BSM parsing is checked against the macOS SDK header, Apple's praudit and
    # libbsm, so this job only makes sense on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Fixtures rebuild byte for byte with libbsm
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures"
          cc -Wall -Wno-deprecated-declarations -o "$RUNNER_TEMP/make_bsm_fixtures" tools/bsm-fixtures/make_bsm_fixtures.c -lbsm
          "$RUNNER_TEMP/make_bsm_fixtures" "$RUNNER_TEMP/fixtures"
          cmp "$RUNNER_TEMP/fixtures/attack_chain.bsm" tests/fixtures/bsm/attack_chain.bsm
          cmp "$RUNNER_TEMP/fixtures/benign_session.bsm" tests/fixtures/bsm/benign_session.bsm
          #praudit exits 1 at the end of a trail even after printing every record, so count the records instead
          praudit -l -n tests/fixtures/bsm/benign_session.bsm > "$RUNNER_TEMP/benign_session.txt" || true
          cat "$RUNNER_TEMP/benign_session.txt"
          test "$(grep -c '^header' "$RUNNER_TEMP/benign_session.txt")" -eq 8

      - name: Replay demo
        run: scripts/replay_demo.sh "$RUNNER_TEMP/replay"

  live-capture:
    # GitHub's macOS runners have passwordless sudo, so this job can turn BSM
    # auditing on and capture from /dev/auditpipe for real. Auditing has been
    # off by default since macOS 14 and Apple's man pages say enabling it
    # takes a reboot. live_smoke.sh tries launchctl bootstrap and audit -i
    # instead. If auditing still does not start it exits 3, and this job
    # says so and runs the same checks on the recorded trail instead of
    # failing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Live capture, or replay if auditing cannot start
        run: |
          #The output goes under /private/tmp because two of the playbooks watch for a program
          #run from a world writable folder, and the runner's temp folder is not one.
          set +e
          sudo scripts/live_smoke.sh /private/tmp/edr-live
          LIVE_STATUS=$?
          set -e
          if [ -f /private/tmp/edr-live/summary.md ]; then
            cat /private/tmp/edr-live/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$LIVE_STATUS" -eq 3 ]; then
            echo "::warning::BSM auditing could not be started on this runner without a reboot, so live capture was not tested. Running the same checks on the recorded trail."
            echo "Live capture not tested: auditing could not start without a reboot. Replay checks follow." >> "$GITHUB_STEP_SUMMARY"
            scripts/live_smoke.sh --replay tests/fixtures/bsm/attack_chain.bsm "$RUNNER_TEMP/replay"
            cat "$RUNNER_TEMP/replay/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$LIVE_STATUS" -ne 0 ]; then
            exit "$LIVE_STATUS"
          fi
