[package]
name = "edr-locald"
version = "0.1.0"
edition = "2021"
description = "Runs the macOS playbooks over capture segments and stores detections"

[lib]
name = "edr_locald"
path = "src/lib.rs"

[[bin]]
name = "edr-locald"
path = "src/main.rs"

[dependencies]
edr-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
hex = "0.4"  # Required by hypothesis module for evidence hashes
thiserror = "1"  # Ship hardening: path validation errors
log = "0.4"      # Ship hardening: logging for path validation
serde_yaml = "0.9"  # Integration layer: config parsing
regex = "1"  # Slot matcher: regex-based predicate matching
ctrlc = "3"  # Graceful shutdown handling

[dev-dependencies]
tempfile = "3"
agent-macos = { path = "../agent-macos" }
