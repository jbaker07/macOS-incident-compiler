[package]
name = "edrctl"
version = "0.1.0"
edition = "2021"
description = "Starts, stops and checks the macOS incident compiler stack"

[[bin]]
name = "edrctl"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
