[package]
name = "edr-core"
version = "0.1.0"
edition = "2021"
description = "Event and evidence pointer types shared by the capture agent and edr-locald"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
sha2 = "0.10"
