[package]
name = "edr-server"
version = "0.1.0"
edition = "2021"
description = "HTTP API and detections page for edr-locald's workbench.db"

[lib]
name = "edr_server"
path = "src/lib.rs"

[[bin]]
name = "edr-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
