[package]
name = "agent-macos"
version = "0.1.0"
edition = "2021"
description = "macOS capture agent: OpenBSM audit records to JSONL segments"

[lib]
name = "agent_macos"
path = "src/lib.rs"

[[bin]]
name = "capture_macos_rotating"
path = "src/bin/capture_macos_rotating.rs"

[dependencies]
edr-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
ctrlc = "3.4"
libc = "0.2"
