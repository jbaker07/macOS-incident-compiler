playbook_id: macos_browser_credential_read
title: Browser password or cookie store read by another program
family: credential_access
severity: HIGH
entity_scope: host|user
ttl_seconds: 300
cooldown_seconds: 300
tags: [credential_access, browser, T1555.003]
narrative: A Chrome, Brave or Firefox credential or cookie database was opened by a program that is not the browser.
slots:
  - slot_id: store_read
    name: Read of Login Data, Cookies, logins.json or key4.db
    required: true
    ttl_seconds: 300
    predicate:
      fact_type: ReadPath
      path_regex: '(Google/Chrome|BraveSoftware/Brave-Browser)/[^/]+/(Login Data|Cookies)$|Firefox/Profiles/[^/]+/(logins\.json|key4\.db|cookies\.sqlite)$'
      actor_exe_not_regex: '/(Google Chrome|Brave Browser|Firefox)\.app/'
