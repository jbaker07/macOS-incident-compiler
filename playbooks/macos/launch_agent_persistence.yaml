playbook_id: macos_launch_agent_persistence
title: LaunchAgent property list written
family: persistence
severity: HIGH
entity_scope: host|user
ttl_seconds: 600
cooldown_seconds: 300
tags: [persistence, launch_agent, T1543.001]
narrative: A property list was created, written or moved into a LaunchAgents folder. launchd starts it at the next login.
slots:
  - slot_id: plist_write
    name: Write of a LaunchAgents plist
    required: true
    ttl_seconds: 600
    predicate:
      fact_type: PersistArtifact
      path_regex: '(^|/)Library/LaunchAgents/[^/]+\.plist$'
