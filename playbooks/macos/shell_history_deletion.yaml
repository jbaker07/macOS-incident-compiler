playbook_id: macos_shell_history_deletion
title: Shell history file deleted
family: defense_evasion
severity: MEDIUM
entity_scope: host|user
ttl_seconds: 300
cooldown_seconds: 300
tags: [defense_evasion, T1070.003]
narrative: A zsh or bash history file was deleted, which removes the record of commands typed in that account.
slots:
